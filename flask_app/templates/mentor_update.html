<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; }
        .navbar { background: #003366; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container"><a class="navbar-brand" href="/mentor_mentees">← Back to Mentees</a></div>
    </nav>

    <div class="container">
        <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
            <h3 style="color: #003366;">Update Mentee Progress</h3>
            <p class="text-muted">Updating: <strong>{{ m.name }} ({{ m.reg }})</strong></p>
            <hr>
            
            <form action="/mentor/mentee/save_update" method="POST">
                <input type="hidden" name="id" value="{{ m.id }}">
                <div class="row">
                    <div class="col-md-8 mb-3"><label>Department</label><input type="text" name="dept" class="form-control" value="{{ m.dept }}"></div>
                    <div class="col-md-4 mb-3"><label>Year</label><input type="number" name="year" class="form-control" value="{{ m.year }}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label>Email</label><input type="email" name="email" class="form-control" value="{{ m.email }}"></div>
                    <div class="col-md-6 mb-3"><label>Phone</label><input type="text" name="phone" class="form-control" value="{{ m.phone }}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label>CGPA</label><input type="number" step="0.01" name="cgpa" class="form-control" value="{{ m.cgpa }}"></div>
                    <div class="col-md-6 mb-3"><label>Attendance (%)</label><input type="number" step="0.01" name="attendance" class="form-control" value="{{ m.attn }}"></div>
                </div>
                <div class="mb-3"><label>Remarks (Update Notes)</label><textarea name="remarks" class="form-control" rows="4">{{ m.remarks }}</textarea></div>
                <div class="d-grid"><button type="submit" class="btn btn-primary">Save Changes</button></div>
            </form>
        </div>
    </div>
</body>
</html>
