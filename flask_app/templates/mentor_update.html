<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; }
        .navbar { background: #003366; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container"><a class="navbar-brand" href="/mentor_mentees">← Back to Mentees</a></div>
    </nav>

    <div class="container">
        <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
            <h3 style="color: #003366;">Update Mentee Progress</h3>
            <p class="text-muted">Updating: <strong>{{ m.name }} ({{ m.reg }})</strong></p>
            <hr>
            
            <form action="/mentor/mentee/save_update" method="POST">
                <!-- Hidden field to keep track of ID -->
                <input type="hidden" name="id" value="{{ m.id }}">

                <div class="mb-3">
                    <label class="form-label">CGPA</label>
                    <input type="number" step="0.01" name="cgpa" class="form-control" value="{{ m.cgpa }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Attendance (%)</label>
                    <input type="number" step="0.01" name="attendance" class="form-control" value="{{ m.attn }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">General Remarks</label>
                    <input type="text" name="remarks" class="form-control" value="{{ m.remarks }}">
                </div>

                <div class="mb-3">
                    <label class="form-label text-danger fw-bold">Confidential Notes (Mentor Only)</label>
                    <textarea name="notes" class="form-control" rows="4">{{ m.notes }}</textarea>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" style="background: #003366;">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
