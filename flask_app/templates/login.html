<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f4f7f6; color: #2c3e50; }</style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container card p-4 shadow" style="max-width: 400px;">
        <h3 class="text-center mb-4" style="color: #003366;">Mentor Login</h3>
        <form action="/login" method="POST">
            <input type="text" name="mentorID" class="form-control mb-3" placeholder="Mentor ID (e.g. 101)" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
            <button type="submit" class="btn btn-primary w-100" style="background: #003366;">Login</button>
        </form>
    </div>
</body>
</html>
