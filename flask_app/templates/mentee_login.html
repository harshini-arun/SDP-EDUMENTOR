<!DOCTYPE html>
<html>
<head>
    <title>Mentee Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 15px; }
        .btn-primary { background: #003366; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow p-4 mx-auto" style="max-width: 400px;">
            <h3 class="text-center mb-4" style="color: #003366;">Mentee Login</h3>
            <form action="/mentee/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">Mentee ID</label>
                    <input type="text" name="menteeID" class="form-control" placeholder="e.g. 1001" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Default: Your Reg No" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="text-center mt-3">
                <a href="/" class="text-muted small">Back to Mentor Login</a>
            </div>
        </div>
    </div>
</body>
</html>
