<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center vh-100">
    <div class="container">
        <div class="card p-4 mx-auto shadow" style="max-width: 400px;">
            <h3 class="text-center text-danger">Admin Access</h3>
            <form action="/admin/login" method="POST">
                <input type="text" name="username" class="form-control mb-3" placeholder="Admin Username" required>
                <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
                <button type="submit" class="btn btn-danger w-100">System Login</button>
            </form>
            <a href="/" class="d-block text-center mt-3 text-muted">Back</a>
        </div>
    </div>
</body>
</html>
