<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Mentoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; color: #2c3e50; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .admin-card { max-width: 400px; border: none; border-radius: 12px; }
        .btn-primary { background: #003366; border: none; }
        .btn-primary:hover { background: #002244; }
        .text-navy { color: #003366; }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="card p-4 shadow admin-card mx-auto">
            <div class="text-center mb-4">
                <h3 class="text-navy fw-bold">System Administration</h3>
                <p class="text-muted small">Please enter your credentials to access the portal</p>
            </div>
            <form action="/admin/login" method="POST">
                <div class="mb-3">
                    <label class="form-label text-navy small fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="admin" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-navy small fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Login to Dashboard</button>
            </form>
            <hr>
            <a href="/" class="text-center text-decoration-none small text-muted">← Back to Role Selection</a>
        </div>
    </div>
</body>
</html>
