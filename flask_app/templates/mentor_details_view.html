<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <a href="/mentee/dashboard" class="btn btn-link text-decoration-none">← Back</a>
        <div class="card shadow-sm p-4 mt-2 text-center" style="max-width: 500px; margin: auto;">
            <div class="display-1 mb-3">🎓</div>
            <h3 style="color: #003366;">{{ m.name }}</h3>
            <p class="text-muted">{{ m.desig }}<br>{{ m.dept }}</p>
            <hr>
            <p><strong>📧 Email:</strong><br>{{ m.email }}</p>
            <p><strong>📞 Phone:</strong><br>{{ m.phone }}</p>
            <div class="badge bg-success">Assigned Mentor</div>
        </div>
    </div>
</body>
</html>
