<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Mentees | Mentor Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #003366; }
        .btn-primary { background-color: #003366; border: none; }
        .btn-primary:hover { background-color: #002244; }
        .table-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">← Back to Mentor Dashboard</a>
            <span class="navbar-text text-white">Logged in as: {{ session['name'] }}</span>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-8">
                <h2 style="color: #003366;">Mentee Management</h2>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addMenteeModal">+ Add New Mentee</button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="input-group mb-4 shadow-sm">
            <span class="input-group-text bg-white">🔍</span>
            <input type="text" id="menteeSearch" class="form-control" placeholder="Search by name or registration number..." onkeyup="filterTable()">
        </div>

        <!-- Mentee Table -->
        <div class="table-container">
            <table class="table table-hover" id="menteeTable">
                <thead>
                    <tr class="table-light">
                        <th>Mentee ID</th>
                        <th>Reg No</th>
                        <th>Name</th>
                        <th>CGPA</th>
                        <th>Attendance</th>
                        <th>Status/Remarks</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for m in mentees %}
                    <tr>
                        <td><span class="badge bg-secondary px-3">{{ m.id }}</span></td>
                        <td><strong>{{ m.reg }}</strong></td>
                        <td>{{ m.name }}</td>
                        <td>{{ m.cgpa }}</td>
                        <td>{{ m.attn }}%</td>
                        <td><span class="badge bg-info text-dark">{{ m.remarks }}</span></td>
                        <td class="text-center">
                            <a href="/mentor/mentee/update/{{ m.id }}" class="btn btn-sm btn-outline-secondary">Edit</a>
                            <a href="/mentor/mentee/delete/{{ m.id }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this mentee?')">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        </div>
    </div>

    <!-- Modal for Adding Mentee -->
    <div class="modal fade" id="addMenteeModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background: #003366; color: white;">
                    <h5 class="modal-title">Add New Mentee Record</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form action="/mentees/add" method="POST">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="name" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Registration Number</label>
                                <input type="text" name="regNo" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">CGPA</label>
                                <input type="number" step="0.01" name="cgpa" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Attendance %</label>
                                <input type="number" step="0.01" name="attendance" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Current Year</label>
                                <select name="year" class="form-select">
                                    <option value="1">1st Year</option>
                                    <option value="2">2nd Year</option>
                                    <option value="3">3rd Year</option>
                                    <option value="4">4th Year</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Confidential Notes (Mentor Only)</label>
                                <textarea name="notes" class="form-control" rows="3" placeholder="Add specific observation about this student..."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Mentee to File</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Minimal JS for Search Filtering -->
    <script>
        function filterTable() {
            let input = document.getElementById('menteeSearch').value.toUpperCase();
            let rows = document.getElementById('menteeTable').getElementsByTagName('tr');
            for (let i = 1; i < rows.length; i++) {
                let text = rows[i].innerText.toUpperCase();
                rows[i].style.display = text.includes(input) ? "" : "none";
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
