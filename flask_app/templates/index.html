<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mentoring System Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; height: 100vh; display: flex; align-items: center; }
        .role-card { 
            border: none; border-radius: 20px; transition: 0.3s; 
            cursor: pointer; text-decoration: none; color: inherit;
        }
        .role-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .icon { font-size: 3rem; margin-bottom: 15px; }
        .mentor-icon { color: #003366; }
        .mentee-icon { color: #28a745; }
        .admin-icon { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="mb-5 fw-bold" style="color: #003366;">Mentoring Management System</h1>
        <div class="row justify-content-center g-4">
            
            <!-- Mentor Option -->
            <div class="col-md-3">
                <a href="/login" class="card p-4 role-card shadow-sm h-100">
                    <h4>Mentor</h4>
                    <p class="text-muted small">Faculty login.</p>
                </a>
            </div>

            <!-- Mentee Option -->
            <div class="col-md-3">
                <a href="/mentee/login" class="card p-4 role-card shadow-sm h-100">
                    <h4>Mentee</h4>
                    <p class="text-muted small">Student login.</p>
                </a>
            </div>

            <!-- Admin Option -->
            <div class="col-md-3">
                <a href="/admin/login" class="card p-4 role-card shadow-sm h-100">
                    <h4>Admin</h4>
                    <p class="text-muted small">System administrator.</p>
                </a>
            </div>

        </div>
    </div>
</body>
</html>
