<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <a href="/mentee/dashboard" class="btn btn-link text-decoration-none">← Back</a>
        <div class="card shadow-sm p-4 mt-2">
            <h3 style="color: #003366;">My Academic Record</h3>
            <hr>
            <div class="row mt-4">
                <div class="col-md-6">
                    <p><strong>Full Name:</strong> {{ m.name }}</p>
                    <p><strong>Reg Number:</strong> {{ m.reg }}</p>
                    <p><strong>Department:</strong> {{ m.dept }}</p>
                    <p><strong>Current Year:</strong> {{ m.year }}</p>
                </div>
                <div class="col-md-6">
                    <p><strong>Email:</strong> {{ m.email }}</p>
                    <p><strong>Phone:</strong> {{ m.phone }}</p>
                    <div class="p-3 bg-light rounded border text-center">
                        <strong>CGPA:</strong> {{ m.cgpa }} | 
                        <strong>Attendance:</strong> {{ m.attn }}%
                    </div>
                </div>
            </div>
            <div class="mt-4 alert alert-info">
                <strong>Mentor Remarks:</strong><br>
                {{ m.remarks }}
            </div>
        </div>
    </div>
</body>
</html>
