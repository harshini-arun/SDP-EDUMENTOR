<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <a href="/mentee/dashboard" class="btn btn-link text-decoration-none">← Back</a>
        <div class="row mt-3">
            <div class="col-md-4">
                <div class="card p-4 shadow-sm">
                    <h5 style="color: #003366;">New Meeting Request</h5>
                    <form action="/mentee/meetings" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Topic / Agenda</label>
                            <input type="text" name="topic" class="form-control" placeholder="e.g. Lab exam doubts" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Preferred Date & Time</label>
                            <input type="datetime-local" name="datetime" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" style="background: #003366;">Send Request</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card p-4 shadow-sm">
                    <h5 class="mb-3">Meeting Requests</h5>
                    <table class="table">
                        <thead class="table-light">
                            <tr>
                                <th>Meeting ID</th>
                                <th>Topic</th>
                                <th>Scheduled Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for mt in meetings %}
                            <tr>
                                <td>#{{ mt.id }}</td>
                                <td>{{ mt.topic }}</td>
                                <td>{{ mt.date }}</td>
                                <td>
                                    <span class="badge {{ 'bg-success' if mt.status == 'completed' else 'bg-warning text-dark' }}">
                                        {{ mt.status }}
                                    </span>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
