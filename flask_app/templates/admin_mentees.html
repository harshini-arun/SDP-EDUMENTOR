<!DOCTYPE html>
<html>
<head>
    <title>Mentee Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; color: #2c3e50; }
        .navbar { background: #003366 !important; }
        .table-container { background: white; border-radius: 12px; padding: 20px; }
        .text-navy { color: #003366; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin/dashboard">Admin Portal</a>
            <div class="d-flex">
                <a href="/admin/dashboard" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h3 class="text-navy mb-4">Registered Mentees</h3>

        <div class="table-container shadow-sm text-center">
            <table class="table table-bordered align-middle">
                <thead style="background: #003366; color: white;">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Reg No</th>
                        <th>Department</th>
                        <th>CGPA</th>
                    </tr>
                </thead>
                <tbody>
                    {% for m in mentees %}
                    <tr>
                        <td>{{ m.id }}</td>
                        <td class="text-start ps-4">{{ m.name }}</td>
                        <td>{{ m.reg }}</td>
                        <td>{{ m.dept }}</td>
                        <td><span class="badge bg-info text-dark">{{ m.cgpa }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="mt-3 text-muted small">
            * Mentee details are managed by their respective Mentors.
        </div>
    </div>
</body>
</html>
