<!DOCTYPE html>
<html>
<head>
    <title>System Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; }
        .text-navy { color: #003366; }
        .stat-box { background: white; border-radius: 12px; padding: 20px; border-top: 4px solid #003366; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h3 class="text-navy fw-bold mb-4">University Academic Report</h3>
        
        <!-- Global Stats Section -->
        <div class="row mb-5">
            <div class="col-md-4">
                <div class="stat-box shadow-sm text-center">
                    <p class="text-muted mb-1">Total Mentees</p>
                    <h2 class="fw-bold">{{ stats.count }}</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-box shadow-sm text-center">
                    <p class="text-muted mb-1">System Avg CGPA</p>
                    <h2 class="fw-bold text-primary">{{ stats.avg_cgpa }}</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-box shadow-sm text-center">
                    <p class="text-muted mb-1">Avg Attendance</p>
                    <h2 class="fw-bold text-success">{{ stats.avg_attn }}%</h2>
                </div>
            </div>
        </div>

        <h4 class="text-navy mb-3">Mentor-wise Performance</h4>
        <div class="bg-white p-4 shadow-sm rounded">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Mentor Name</th>
                        <th>Department</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for m in mentors %}
                    <tr>
                        <td class="fw-bold">{{ m.name }}</td>
                        <td>{{ m.dept }}</td>
                        <td class="text-end">
                            <a href="/admin/reports/mentor/{{ m.id }}" class="btn btn-sm btn-outline-primary">View Stats</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <a href="/admin/dashboard" class="btn btn-link text-muted mt-3">Back to Dashboard</a>
    </div>
</body>
</html>
